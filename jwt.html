<script>
  /* Clean URLs: projects live at "/<id>". Old project.html?id=x and
     /project?id=x links are sent there; "/x.html" shows as "/x". */
  (function () {
    var path = location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html$/, '');
    if (path === 'project') {
      var q = new URLSearchParams(location.search);
      location.replace('/' + (q.get('id') || q.get('p') || '') + location.hash);
    } else if (/\.html$/.test(location.pathname)) {
      history.replaceState(history.state, '', '/' + path + location.search + location.hash);
    }
  })();
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/assets/favicon.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css?v=102" />
<script>
  /* Arriving from a gallery card's expand: skip the veil reveal. The
     card's clone ended on where the first image tile should sit;
     project.js settles the tile from there (see settleArrival). */
  try {
    var arrive = JSON.parse(sessionStorage.getItem('pj-expand') || 'null');
    sessionStorage.removeItem('pj-expand');
    if (arrive && arrive.id === location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html$/, '')) {
      var h = document.documentElement;
      h.classList.add('from-card');
      window.__pjArrive = arrive;
      /* Hold the clone's image on its final rect from the first paint,
         so nothing blinks while the tile waits for the header. */
      if (arrive.image) h.style.setProperty('--pj-img', 'url("' + arrive.image + '")');
      if (arrive.rect) {
        ['left', 'top', 'width', 'height'].forEach(function (k) { h.style.setProperty('--pj-' + k, arrive.rect[k] + 'px'); });
      }
    }
  } catch (e) { /* noop */ }
</script>
